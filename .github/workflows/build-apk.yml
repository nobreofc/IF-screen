name: Gerar APK do IF Screen

on:
  workflow_dispatch:
    inputs:
      relay_url:
        description: "Endereço do servidor-ponte no Railway (ex.: https://ifscreen-relay-production.up.railway.app)"
        required: false
        default: ""
      app_key:
        description: "APP_KEY (a mesma configurada no Railway e na Central)"
        required: false
        default: "ifscreen-app-key"
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # O Android SDK já vem instalado nos runners do GitHub (ANDROID_HOME).
      # Só aceitamos as licenças e garantimos a plataforma 35.
      - name: Preparar Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0" "platform-tools" > /dev/null || true

      - name: Compilar APK (release, assinado)
        env:
          RELAY: ${{ github.event.inputs.relay_url || vars.IFSCREEN_RELAY_URL }}
          APPKEY: ${{ github.event.inputs.app_key || vars.IFSCREEN_APP_KEY || 'ifscreen-app-key' }}
        run: |
          # Se o arquivo passou pelo Windows com quebras de linha CRLF, corrige antes de rodar
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          # Se o download de alguma biblioteca falhar, tenta mais uma vez
          ./gradlew --no-daemon assembleRelease -PIFSCREEN_RELAY_URL="$RELAY" -PIFSCREEN_APP_KEY="$APPKEY" \
            || (sleep 30 && ./gradlew --no-daemon --refresh-dependencies assembleRelease -PIFSCREEN_RELAY_URL="$RELAY" -PIFSCREEN_APP_KEY="$APPKEY")
          cp app/build/outputs/apk/release/app-release.apk ../IF-Screen-1.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IF-Screen-apk
          path: IF-Screen-1.0.0.apk
